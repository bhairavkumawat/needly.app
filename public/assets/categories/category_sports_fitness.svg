<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground contact shadow -->
  <ellipse cx="32" cy="54" rx="22" ry="4.5" fill="#202536" fill-opacity="0.12"/>
  <ellipse cx="44" cy="52" rx="9" ry="3" fill="#202536" fill-opacity="0.15"/>

  <!-- DUMBBELL (Angled 3/4 Isometric) -->
  <!-- Left Weight Plate (Back) -->
  <g transform="translate(-2, 0)">
    <!-- Plate Depth/Side (Dark Navy) -->
    <path d="M15 26L21 21H24L18 26V37L15 35V26Z" fill="#161A26"/>
    <!-- Outer Rim Base -->
    <rect x="13" y="24" width="7" height="15" rx="3.5" fill="#202536"/>
    <rect x="14" y="25" width="5" height="13" rx="2.5" fill="#6D8298"/>
    <rect x="14.5" y="25.5" width="2" height="12" rx="1" fill="#8FA5BB"/>
  </g>

  <!-- Dumbbell Steel Bar (Center) -->
  <rect x="19" y="30" width="20" height="4.5" rx="1.5" fill="#202536"/>
  <rect x="19" y="29.5" width="20" height="4" rx="1.5" fill="#D2D2CE"/>
  <rect x="19" y="29.5" width="20" height="1.8" rx="0.9" fill="#FFFFFF"/>
  <!-- Knurling texture lines -->
  <line x1="26" y1="30" x2="26" y2="33.5" stroke="#202536" stroke-width="0.8"/>
  <line x1="29" y1="30" x2="29" y2="33.5" stroke="#202536" stroke-width="0.8"/>
  <line x1="32" y1="30" x2="32" y2="33.5" stroke="#202536" stroke-width="0.8"/>

  <!-- Right Weight Plate (Front) -->
  <g transform="translate(14, 0)">
    <!-- Plate Depth (Dark Navy) -->
    <rect x="23" y="23" width="7" height="17" rx="3.5" fill="#202536"/>
    <rect x="23.5" y="24" width="5.5" height="15" rx="2.5" fill="#6D8298"/>
    <rect x="24" y="24.5" width="2.2" height="14" rx="1" fill="#8FA5BB"/>
    <circle cx="26" cy="31.5" r="1.5" fill="#202536"/>
  </g>

  <!-- SPORTS BALL (Nestled in Front Right) -->
  <!-- Ball Shadow -->
  <circle cx="43" cy="42" r="9" fill="#202536" fill-opacity="0.1"/>
  <!-- Ball Body (Sage Green) -->
  <circle cx="42" cy="41" r="8.5" fill="#8FA58A"/>
  <!-- Ball Top-Left Highlight -->
  <path d="M37 36C40 33.5 45 34 47 37C45 35 40 34.5 37 36Z" fill="#A6BEA1"/>
  <!-- Tennis/Sports Ball Curved Seams (Warm Beige) -->
  <path d="M35 38C38 40 40 45 39 48" stroke="#E8D7B5" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M48 35C45 37 43 42 45 46" stroke="#E8D7B5" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Dark Navy Seam Accent -->
  <circle cx="40" cy="38" r="1" fill="#FFFFFF" fill-opacity="0.4"/>
</svg>
