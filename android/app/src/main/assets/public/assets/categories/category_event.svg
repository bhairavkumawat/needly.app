<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft ground contact shadow -->
  <ellipse cx="32" cy="54" rx="21" ry="4.5" fill="#202536" fill-opacity="0.12"/>

  <!-- Calendar Backing & 3D Extrusion -->
  <rect x="15" y="16" width="34" height="34" rx="6" fill="#202536"/>
  <rect x="14" y="15" width="34" height="34" rx="6" fill="#D4D4D0"/>
  <rect x="14" y="14" width="34" height="34" rx="6" fill="#E8E8E5"/>

  <!-- Calendar Top Header (Soft Orange) -->
  <path d="M14 20C14 16.6863 16.6863 14 20 14H42C45.3137 14 48 16.6863 48 20V24H14V20Z" fill="#C98A48"/>
  <path d="M14 19C14 16.5 16.5 14 19.5 14H42.5C45.5 14 48 16.5 48 19V20.5H14V19Z" fill="#DF9E58" fill-opacity="0.4"/>

  <!-- Twin Spiral Rings (Dark Navy) -->
  <rect x="21" y="11" width="3.8" height="6.5" rx="1.9" fill="#202536"/>
  <rect x="21.5" y="11.5" width="1.8" height="5" rx="0.9" fill="#31384E"/>
  <rect x="37" y="11" width="3.8" height="6.5" rx="1.9" fill="#202536"/>
  <rect x="37.5" y="11.5" width="1.8" height="5" rx="0.9" fill="#31384E"/>

  <!-- Calendar Date Grid -->
  <!-- Row 1 -->
  <rect x="19" y="28" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <rect x="26" y="28" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <rect x="33" y="28" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <rect x="40" y="28" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <!-- Row 2 -->
  <rect x="19" y="34" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <rect x="26" y="34" width="4" height="3" rx="1" fill="#8FA58A"/>
  <circle cx="28" cy="35.5" r="3.5" stroke="#202536" stroke-width="1.2" fill="none"/>
  <rect x="33" y="34" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <rect x="40" y="34" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.6"/>
  <!-- Row 3 -->
  <rect x="19" y="40" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.4"/>
  <rect x="26" y="40" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.4"/>
  <rect x="33" y="40" width="4" height="3" rx="1" fill="#6D8298" fill-opacity="0.4"/>

  <!-- Angled VIP Event Ticket in Front Right -->
  <g transform="rotate(14 43 41)">
    <!-- Ticket Shadow -->
    <rect x="33" y="32" width="18" height="11" rx="2.5" fill="#202536" fill-opacity="0.18"/>
    <!-- Ticket Body -->
    <rect x="32" y="31" width="18" height="11" rx="2.5" fill="#E8D7B5"/>
    <path d="M32 31H40V42H32C30.8954 42 30 41.1046 30 40V33C30 31.8954 30.8954 31 32 31Z" fill="#F5ECE0"/>
    <!-- Perforated Notch -->
    <circle cx="43" cy="31" r="1.5" fill="#E8E8E5"/>
    <circle cx="43" cy="42" r="1.5" fill="#E8E8E5"/>
    <line x1="43" y1="33" x2="43" y2="40" stroke="#C98A48" stroke-width="1" stroke-dasharray="1.5 1"/>
    <!-- Star on Ticket Stub -->
    <polygon points="46.5,34.5 47.3,36.5 49.5,36.5 47.7,37.8 48.4,39.8 46.5,38.5 44.6,39.8 45.3,37.8 43.5,36.5 45.7,36.5" fill="#202536"/>
  </g>

  <!-- Top-Right 3D Sparkle Star -->
  <path d="M47 13L48.2 16.5L52 17.5L48.5 19L47.5 22.5L46.2 19L42.5 18L46 16.5L47 13Z" fill="#C98A48"/>
  <circle cx="47.2" cy="17.7" r="1" fill="#DF9E58"/>
</svg>
